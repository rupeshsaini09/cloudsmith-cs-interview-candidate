name: Publish Python Package

on:
  workflow_run:
    workflows: ["Build Python Package"]
    types:
      - completed


env:
  CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
  CLOUDSMITH_REPOSITORY: "staging"
  CLOUDSMITH_SERVICE_SLUG: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}

permissions:
  id-token: write                           # ✅ required for OIDC auth with Cloudsmith
  contents: read                            # ✅ required for downloading artifacts
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
#    ##if: ${{ github.event.workflow_run.conclusion == 'success' }}
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') 


    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: List directory contents
        run: ls -la dist/

      - name: Authenticate using Cloudsmith Action
        uses: cloudsmith-io/cloudsmith-cli-action@v1.0.3
        with:
          oidc-namespace: ${{ env.CLOUDSMITH_NAMESPACE }}
          oidc-service-slug: ${{ env.CLOUDSMITH_SERVICE_SLUG }}

      - name: Push to Cloudsmith using Cloudsmith Action
        run: |
          run: |
          echo "Uploading packages from dist/ to ${{ env.CLOUDSMITH_NAMESPACE }}/${{ env.CLOUDSMITH_REPOSITORY }}"
          # Find either wheel or sdist - adjust if you build only one
          PACKAGE_FILE=$(ls dist/*.whl 2>/dev/null || ls dist/*.tar.gz 2>/dev/null)
          if [ -z "$PACKAGE_FILE" ]; then
            echo "No package file (.whl or .tar.gz) found in dist/"
            exit 1
          fi
          echo "Found package(s): $PACKAGE_FILE"
          # Upload all files in dist/
          cloudsmith push python ${{ env.CLOUDSMITH_NAMESPACE }}/${{ env.CLOUDSMITH_REPOSITORY }} dist/* --republish