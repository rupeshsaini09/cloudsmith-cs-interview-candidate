name: Promote Python Package

on:
  repository_dispatch:
    types: [cloudsmith.package.synchronized]

env:
  CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
  CLOUDSMITH_STAGING_REPO: 'staging'        # 🔁 fixed: was incorrectly set to 'production'
  CLOUDSMITH_PRODUCTION_REPO: 'production'  # 🔁 fixed: was incorrectly set to 'staging'
  CLOUDSMITH_SERVICE_SLUG: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
  PACKAGE_NAME: 'python_package'            # 🔁 match [project].name from pyproject.toml

permissions:
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Install Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@v1.0.1
        with:
          oidc-namespace: ${{ env.CLOUDSMITH_NAMESPACE }}
          oidc-service-slug: ${{ env.CLOUDSMITH_SERVICE_SLUG }}

      - name: Debug webhook payload
        run: |
            echo "package_name: ${{ github.event.client_payload.package_name }}"
            echo "package_version: ${{ github.event.client_payload.package_version }}"
            echo "slugid": ${{ github.event.client_payload.slugid }}"
            
      - name: Tag package as ready-for-production
        run: |
              SLUGID="${{ github.event.client_payload.slugid }}"
    
              if [ -z "$SLUGID" ] || [ "$SLUGID" = "null" ]; then
                echo "SlugID is missing. Cannot tag package."
                exit 1
              fi
    
              echo "Tagging package with 'ready-for-production': $SLUGID"
    
              cloudsmith tag package ${{ env.CLOUDSMITH_NAMESPACE }}/${{ env.CLOUDSMITH_STAGING_REPO }} \
                "$SLUGID" ready-for-production
    
      - name: Promote first ready-for-production package
        run: |
              echo "Querying for packages with tag: ready-for-production"
    
              PACKAGE_DATA=$(cloudsmith list package ${{ env.CLOUDSMITH_NAMESPACE }}/${{ env.CLOUDSMITH_STAGING_REPO }} \
                -q "tag:ready-for-production" -F json)
    
              IDENTIFIER=$(echo "$PACKAGE_DATA" | jq -r '.data[0].identifier_perm')
    
              if [ -z "$IDENTIFIER" ] || [ "$IDENTIFIER" = "null" ]; then
                echo "No tagged packages found to promote."
                exit 1
              fi
    
              echo "Found package identifier: $IDENTIFIER"
              echo "Promoting package to production..."
    
              cloudsmith mv --yes \
                ${{ env.CLOUDSMITH_NAMESPACE }}/${{ env.CLOUDSMITH_STAGING_REPO }}/$IDENTIFIER \
                ${{ env.CLOUDSMITH_PRODUCTION_REPO }}