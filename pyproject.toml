[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "example_package"                      # ✅ matches your package directory
dynamic = ["version"]

authors = [
  { name = "Example Author", email = "author@example.com" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.hatch.version]
source = "vcs"                                # ✅ use Git tag for versioning

[tool.hatch.build]
sources = ["src"]                             # ✅ tells Hatch to look for packages inside /src

[tool.hatch.build.targets.wheel]
packages = ["src/example_package"]            # ✅ full path to your actual package
